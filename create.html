<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Lua Link</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000000; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #0a0a0a; border: 1px solid #262626; padding: 35px; border-radius: 12px; width: 100%; max-width: 500px; }
        h2 { margin-bottom: 20px; font-size: 20px; text-align: center; }
        label { display: block; font-size: 13px; color: #888888; margin-bottom: 5px; margin-top: 15px; }
        input, textarea { width: 100%; background-color: #050505; color: #ffffff; border: 1px solid #333333; border-radius: 8px; padding: 10px; font-size: 14px; outline: none; }
        textarea { height: 120px; resize: none; font-family: monospace; }
        input:focus, textarea:focus { border-color: #ffffff; }
        .btn { background-color: #ffffff; color: #000000; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px; }
        .btn:hover { background-color: #e0e0e0; }
        .result-box { margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Your Script Link</h2>
        
        <label>Discord Invite Link</label>
        <input type="text" id="dc-link" placeholder="https://discord.gg/xxxx">

        <label>Secret Code (Discord)</label>
        <input type="text" id="dc-code" placeholder="ENTROPY??">

        <label>Loadstring URL / Raw Lua Script</label>
        <textarea id="lua-script" placeholder="loadstring(game:HttpGet('...'))()"></textarea>

        <button class="btn" onclick="generateLink()">Generate Link</button>

        <div class="result-box" id="result-div">
            <label>Your Shareable Link:</label>
            <input type="text" id="final-url" readonly onclick="this.select()">
        </div>
    </div>

    <script>
        function generateLink() {
            const dcLink = document.getElementById('dc-link').value.trim();
            const dcCode = document.getElementById('dc-code').value.trim();
            const luaScript = document.getElementById('lua-script').value.trim();

            if(!dcLink || !dcCode || !luaScript) {
                alert("Please fill in all fields!");
                return;
            }

            // Bungkus data dan encode ke Base64 supaya aman di URL
            const dataObj = {
                d: dcLink,
                c: dcCode,
                s: luaScript
            };

            const encodedData = btoa(encodeURIComponent(JSON.stringify(dataObj)));
            
            // Buat link otomatis berdasarkan domain github io saat ini
            const baseURL = window.location.origin + window.location.pathname.replace('create.html', '');
            const finalLink = baseURL + "index.html#" + encodedData;

            document.getElementById('final-url').value = finalLink;
            document.getElementById('result-div').style.display = 'block';
        }
    </script>
</body>
</html>
